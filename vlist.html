<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtualized List</title>
    <style>
        * {
            box-sizing: border-box;
        }
        main {
            border: 1px solid red;
            height: 300px;
            overflow: auto;
        }
        li {
            border: 1px dotted black;
        }
    </style>
</head>
<body>
    <main>
        <ul>
            <li>Geronimo Stilton</li>
        </ul>
    </main>
    <script>
        const dataCount = 10_000;
        const data = [];
        for (let i = 0; i < dataCount; i++) {
            data.push(`data[${i}]`);
        }

        const main = document.querySelector("main");
        const ul = document.querySelector("ul");
        const li = document.querySelector("li");


        // let's take the height of one li
        const liRect = li.getBoundingClientRect();
        const liHeight = liRect.height;

        // let's calculate what the height of the scrollable area should be
        const scrollableHeight = data.length * liHeight;

        // we need to trick the page into showing the correct scroll bar
        // so let's directly set the height of the ul
        ul.style.height = `${scrollableHeight}px`;

        // let's now make a pool of lis that we will reuse
        const mainRect = main.getBoundingClientRect();
        const mainHeight = mainRect.height;
        const poolSize = Math.floor(mainHeight / liHeight) * 3 - 2;
        const poolLis = [];
        for (let i = 0; i < poolSize; i++) {
            const li = document.createElement("li");
            ul.appendChild(li);
            poolLis.push(li);
        }

        // now let's handle the scroll event
        main.addEventListener("scroll", () => {
            // let's maintain the balance of lis such that there is an equal number of them above and below the visible window

            // there should be poolSize / 3 lis visible, poolSize / 3 above, and poolSize / 3 below
            // except when we're at the top or the bottom of the list

            // when lis go north of the north shadow then we should move them to the south
            // when lis go south of the south shadow then we should move them to the north

            // let's list the relevant y-axis positions that we will need
            // top of computer screen is y = 0
            const mainTop = mainRect.top;
            const mainBottom = mainRect.bottom;
            const northShadowTop = mainRect.top - mainRect.height;
            const southShadowBottom = mainRect.bottom + mainRect.height;

            // let's check here if a li is north of the north shadow
            poolLis.forEach(li => {
                const liRect = li.getBoundingClientRect();
                if (liRect.bottom < northShadowTop) {
                    // the li is north of the north shadow
                    // let's move this li to the far south
                    li.remove();
                    ul.appendChild(li);
                }
            });



        });



    </script>
</body>
</html>
