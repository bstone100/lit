<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtualized List</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
        main {
            border: 1px solid red;
            height: 200px;
            overflow: auto;
        }
        ul {
            position: relative
        }
        li {
            border: 1px dotted black;
            position: absolute;
            height: 100px;
        }
    </style>
</head>
<body>
    <main>
        <ul>
        </ul>
    </main>
    <script>
        // TODO: bug, when data is 1,000,000, can only scroll to 167,772, perhaps ul height can't be set that high


        const dataArraySize = 10000;
        const dataArray = [];
        for (let i = 0; i < dataArraySize; i++) {
            dataArray.push(`dataArray[${i}]`);
        }

        const windowSizePx = 200;
        const itemSizePx = 100;

        const ul = document.querySelector("ul");
        ul.style.height = `${itemSizePx * dataArraySize}px`;

        const windowSize = windowSizePx / itemSizePx;
        const bufferSize = windowSize;
        const DOMArray = [];

        function styleLi(DOMArrayIndex) {
            const { li, dataPointer } = DOMArray.at(DOMArrayIndex);
            if (dataPointer < 0 || dataPointer >= dataArraySize) {
                li.style.display = "none";
            } else {
                li.style.display = "";
                li.textContent = dataArray[dataPointer];
                li.style.transform = `translateY(${itemSizePx * dataPointer}px)`;
            }
        }

        for (let i = -bufferSize; i < windowSize + bufferSize; i++) {
            const li = document.createElement("li");
            const dataPointer = i;
            ul.appendChild(li);
            DOMArray.push({
                li,
                dataPointer
            });
            styleLi(-1);
        }

        let DOMHead = 0; // index into DOMArray

        function onScrollRight() {
            // core algo
            DOMArray[DOMHead].dataPointer = DOMArray.at(DOMHead - 1).dataPointer + 1;
            styleLi(DOMHead);
            DOMHead = (DOMHead + 1) % DOMArray.length;
        }

        function onScrollLeft() {
            // core algo
            DOMArray.at(DOMHead - 1).dataPointer = DOMArray[DOMHead].dataPointer - 1;
            styleLi(DOMHead - 1);
            DOMHead = DOMHead - 1 >= 0 ? DOMHead - 1 : DOMArray.length - 1;
        }

        let prevIndex = 0;
        let prevScroll = 0;
        const main = document.querySelector("main");

        function onScroll() {
            // need to calculate whether to scroll left or right or not at all

            // console.log({scrollDelta: main.scrollTop - prevScroll});
            prevScroll = main.scrollTop;

            const index = Math.floor(main.scrollTop / itemSizePx);
            const delta = index - prevIndex;
            prevIndex = index;

            console.log({delta, fullWindow: windowSize + bufferSize * 2});



            if (delta === 0) return;

            // the delta can get very large depending on the scroll speed, this makes the for loops O(dataArraySize)
            // to reset the window plus buffers takes window + buffer * 2 operations
            // so only reset the window if delta > window + buffer * 2
            if (Math.abs(delta) > windowSize + bufferSize * 2) {
                for (let DOMArrayIndex = 0, dataIndex = index - bufferSize; DOMArrayIndex < DOMArray.length; DOMArrayIndex++, dataIndex++) {
                    DOMArray[DOMArrayIndex].dataPointer = dataIndex;
                    styleLi(DOMArrayIndex);
                }
                DOMHead = 0;
                return;
            }

            if (delta > 0) {
                for (let i = 0; i < delta; i++) {
                    onScrollRight();
                }
            } else {
                for (let i = 0; i < Math.abs(delta); i++) {
                    onScrollLeft();
                }
            }
        }

        main.addEventListener("scroll", onScroll);


    </script>
</body>
</html>
